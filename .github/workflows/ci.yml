# Capacitarr CI Pipeline (GitHub Actions)
#
# Runs on every push to main and every pull request targeting main.
# Mirrors the local `make ci` checks using the same tool versions.
#
# Stages (parallelism):
#   lint + test     — all four jobs run in parallel
#   build + security — run in parallel after lint+test pass

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────────────

  lint-go:
    name: "Lint: Go (golangci-lint v2.11.4)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Create go:embed placeholder
        run: mkdir -p backend/frontend/dist && touch backend/frontend/dist/.gitkeep
      - name: Run golangci-lint (Docker — matches make lint:ci)
        run: >
          docker run --rm --pull missing
          -v ${{ github.workspace }}/backend:/app
          -w /app
          golangci/golangci-lint:v2.11.4
          sh -c "golangci-lint config verify && golangci-lint run ./..."

  lint-frontend:
    name: "Lint: Frontend (ESLint + Prettier + TypeScript)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile
      - name: Lint
        run: cd frontend && pnpm lint
      - name: Format check
        run: cd frontend && pnpm format:check
      - name: Type check
        run: cd frontend && pnpm typecheck

  # ── Test ──────────────────────────────────────────────────────────────────────

  test-go:
    name: "Test: Go"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.8"
      - name: Create go:embed placeholder
        run: mkdir -p backend/frontend/dist && touch backend/frontend/dist/.gitkeep
      - name: Run tests
        run: cd backend && go test -v ./... -count=1

  test-frontend:
    name: "Test: Frontend (Vitest)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile
      - name: Run tests
        run: cd frontend && pnpm test

  # ── Build ─────────────────────────────────────────────────────────────────────

  build-docker:
    name: "Build: Docker (multi-arch)"
    runs-on: ubuntu-latest
    needs: [lint-go, lint-frontend, test-go, test-frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build multi-arch Docker image (no push)
        run: >
          docker buildx build
          --platform linux/amd64,linux/arm64
          --provenance=false
          --output=type=cacheonly
          .

  # ── Security ──────────────────────────────────────────────────────────────────

  security-govulncheck:
    name: "Security: govulncheck"
    runs-on: ubuntu-latest
    needs: [lint-go, lint-frontend, test-go, test-frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.8"
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Create go:embed placeholder
        run: mkdir -p backend/frontend/dist && touch backend/frontend/dist/.gitkeep
      - name: Run govulncheck
        run: cd backend && govulncheck ./...

  security-pnpm-audit:
    name: "Security: pnpm audit"
    runs-on: ubuntu-latest
    needs: [lint-go, lint-frontend, test-go, test-frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile
      - name: Run pnpm audit
        # --ignore-registry-errors: npm retired legacy audit endpoints (410 Gone)
        # pnpm <=10.x still uses the old endpoints. Trivy provides equivalent CVE coverage.
        # Remove flag when pnpm ships bulk advisory endpoint support (pnpm/pnpm#11265).
        run: cd frontend && pnpm audit --ignore-registry-errors

  security-trivy:
    name: "Security: Trivy filesystem scan"
    runs-on: ubuntu-latest
    needs: [lint-go, lint-frontend, test-go, test-frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Trivy filesystem scan (backend)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: backend/
          exit-code: "1"
          severity: HIGH,CRITICAL
          scanners: vuln
          version: "v0.69.3"
      - name: Trivy filesystem scan (frontend)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: frontend/
          exit-code: "1"
          severity: HIGH,CRITICAL
          scanners: vuln
          version: "v0.69.3"

  security-trivy-image:
    name: "Security: Trivy image scan"
    runs-on: ubuntu-latest
    needs: [lint-go, lint-frontend, test-go, test-frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build Docker image for scanning
        run: docker build -t capacitarr:ci-scan .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: capacitarr:ci-scan
          exit-code: "1"
          severity: HIGH,CRITICAL
          scanners: vuln
          version: "v0.69.3"

  security-gitleaks:
    name: "Security: Gitleaks (v8.30.1)"
    runs-on: ubuntu-latest
    needs: [lint-go, lint-frontend, test-go, test-frontend]
    container: zricethezav/gitleaks:v8.30.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --verbose

  security-semgrep:
    name: "Security: Semgrep SAST"
    runs-on: ubuntu-latest
    needs: [lint-go, lint-frontend, test-go, test-frontend]
    container: semgrep/semgrep:1.155.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run Semgrep
        run: semgrep scan --config=auto --error .
